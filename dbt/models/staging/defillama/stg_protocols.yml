version: 2

models:
  - name: stg_protocols
    description: "Cleaned protocol-level data from DefiLlama."

    columns:
      - name: protocol_id
        description: "Unique DefiLlama protocol identifier."
        data_tests:
          - not_null

      - name: protocol_name
        description: "Name of the protocol."
        data_tests:
          - not_null

      - name: snapshot_at
        description: "Timestamp when the data was ingested."
        data_tests:
          - not_null

      - name: tvl
        description: "Total value locked in USD."